{% extends "base.html" %}

{% block title %}{{ t('leads_title') }}{% endblock %}

{% block content %}
<section id="leads" class="section section-show" style="padding-top:100px;">
  <div class="container">
    <div class="section-title">
      <h2>{{ t('leads_title') }}</h2>
      <p>{{ t('pricing_calculator_subtitle') }}</p>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <form id="leadForm">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary">Send</button>
            </form>

            <div id="leadResult" class="mt-3" role="status" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h5>Contact Info</h5>
            <p>Use this form to submit leads. We respect your privacy.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
document.getElementById('leadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    message: document.getElementById('message').value,
  };

  const resEl = document.getElementById('leadResult');
  resEl.textContent = 'Sending...';

  try {
    const resp = await fetch('/api/leads/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (resp.status === 201) {
      resEl.textContent = 'Thank you — your lead has been submitted.';
      this.reset();
    } else {
      const body = await resp.json().catch(()=>({}));
      resEl.textContent = body.error || 'Submission failed.';
    }
  } catch (err) {
    resEl.textContent = 'Network error.';
  }
});
</script>
{% endblock %}
