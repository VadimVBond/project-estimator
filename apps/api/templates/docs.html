{% block docs %}
  <!-- ======= Docs ======= -->
  <section id="docs" class="services">
    <div class="container">
      <div class="section-title">
        <h2>{{ t('docs_title') }}</h2>
        <p>{{ t('docs_subtitle') }}</p>
      </div>
      <div class="row">
        <div class="col-lg-6 col-md-6 d-flex align-items-stretch mt-4">
          <div class="icon-box">
            <div class="icon">
              <i class="bi bi-journal-text"></i>
            </div>
            <h4>{{ t('docs_overview_title') }}</h4>
            <p>{{ t('docs_overview_description') }}</p>
          </div>
        </div>
        <div class="col-lg-6 col-md-6 d-flex align-items-stretch mt-4">
          <div class="icon-box">
            <div class="icon">
              <i class="bi bi-file-earmark-text"></i>
            </div>
            <h4>{{ t('docs_resources_title') }}</h4>
            <p>{{ t('docs_resources_description') }}</p>
          </div>
        </div>
      </div>
    </div>
  </section><!-- End Docs Section -->
{% endblock %}
