    <style>
        :root { 
            --bg: #f8fafc; 
            --text-main: #1e293b; 
            --text-muted: #475569;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --sidebar-bg: #f8fafc;
            --sidebar-text: #1e293b;
            --sidebar-border: #e2e8f0;
        }
        [data-theme="dark"] { 
            --bg: #0f172a; 
            --text-main: #f1f5f9; 
            --text-muted: #cbd5e1;
            --card-bg: #1e293b;
            --card-border: #334155;
            --sidebar-bg: #0f172a;
            --sidebar-text: #f1f5f9;
            --sidebar-border: #334155;
        }
        html,
        body {
            margin: 0;
            width: 100%;
        }
        body {
            background-color: var(--bg); 
            color: var(--text-main); 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }
        .sidebar {
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text) !important;
            border-right: 1px solid var(--sidebar-border);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .sidebar, .sidebar h1, .sidebar h2, .sidebar h3, .sidebar p, .sidebar span, .sidebar a, .sidebar li, .sidebar i {
            color: var(--sidebar-text) !important;
        }
        .sidebar a:hover {
            color: #60a5fa !important;
        }
        .sidebar .border-slate-700 {
            border-color: var(--sidebar-border) !important;
        }
        .sidebar .text-slate-400,
        .sidebar .text-slate-500 {
            color: var(--sidebar-text) !important;
        }
        :root {
            --button-bg: #e2e8f0;
            --button-text: #0f172a;
            --button-border: #cbd5e1;
            --button-hover-bg: #cbd5e1;
            --interest-bg: #e2e8f0;
            --interest-text: #0f172a;
        }
        [data-theme="dark"] {
            --button-bg: #1e293b;
            --button-text: #f8fafc;
            --button-border: #334155;
            --button-hover-bg: #334155;
            --interest-bg: #334155;
            --interest-text: #f8fafc;
        }
        #theme-toggle {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--button-border);
        }
        #theme-toggle:hover {
            background-color: var(--button-hover-bg);
        }
        .interest-pill {
            background-color: var(--interest-bg) !important;
            color: var(--interest-text) !important;
        }
        .profile-img { width: 120px; height: 120px; object-fit: cover; border-radius: 16px; border: 3px solid var(--sidebar-border); }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
            border: 1px solid var(--card-border); 
        }
        .text-content { color: var(--text-muted); }
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.55rem;
            border: 1px solid transparent;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.12);
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .lang-btn:hover {
            background: rgba(96, 165, 250, 0.16);
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-1px);
        }
        .lang-flag {
            width: 20px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
        }
        .lang-code {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .active-lang {
            outline: 2px solid #60a5fa;
            outline-offset: 2px;
            border-color: rgba(96, 165, 250, 0.55);
            background: rgba(96, 165, 250, 0.2);
        }
        .profile-img { width: 120px; height: 120px; object-fit: cover; border-radius: 16px; border: 3px solid #334155; }
        
        .portfolio-item { transition: transform 0.3s ease; }
        .portfolio-item:hover { transform: translateY(-5px); }
        .portfolio-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        .tech-stack-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .portfolio-grid { grid-template-columns: repeat(1, minmax(0, 1fr)); }

        .tech-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.75rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            border-radius: 0.75rem;
            transition: all 0.2s;
        }
        .tech-badge i {
            font-size: 1.1rem;
            line-height: 1;
        }
        .tech-badge span {
            font-size: 0.85rem;
            letter-spacing: 0.03em;
        }
        .tech-badge:hover {
            border-color: #60a5fa;
            background: rgba(30, 41, 59, 0.8);
        }

        @media (min-width: 768px) {
            aside {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
            .portfolio-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media print {
            .no-print { display: none !important; }
            html, body { margin: 0 !important; width: 100% !important; overflow: visible !important; }
            body { background: white !important; color: black !important; display: block !important; }
            main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; width: 100% !important; min-width: 0 !important; }
            .card { border: 1px solid #ddd !important; box-shadow: none !important; break-inside: avoid; }
        }

                body.exporting-pdf aside {
            display: block !important;
            position: static !important;
            top: auto !important;
            height: auto !important;
            overflow: visible !important;
            width: auto !important;
            max-width: none !important;
            flex-shrink: 0 !important;
            border-right: 1px solid var(--sidebar-border) !important;
            border-bottom: none !important;
            box-sizing: border-box !important;
            padding: 1.25rem !important;
            min-width: 0 !important;
        }
        body.exporting-pdf {
            display: grid !important;
            grid-template-columns: 260px minmax(0, 1fr) !important;
            align-items: start !important;
            column-gap: 1rem !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        }
        body.exporting-pdf main {
            flex: none !important;
            max-width: none !important;
            width: auto !important;
            min-width: 0 !important;
            display: block !important;
            padding: 1rem !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        body.exporting-pdf .card {
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;
            -moz-column-break-inside: avoid;
        }
        body.exporting-pdf .tech-stack-grid {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        body.exporting-pdf .tech-badge {
            min-height: 56px;
            padding: 0.45rem;
        }
        body.exporting-pdf .portfolio-grid {
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1rem;
        }
        body.exporting-pdf .portfolio-item:hover {
            transform: none;
        }
        body.exporting-pdf header.no-print,
        body.exporting-pdf aside > section.no-print {
            display: none !important;
        }
        body.exporting-pdf .grid:not(.tech-stack-grid):not(.portfolio-grid) {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
        }
    </style>
</head>

                `${t.lang_german} — ${t.lang_german_level}`,
                `${t.lang_russian} — ${t.lang_russian_level}`,
                `${t.lang_french} — ${t.lang_french_level}`,
                `${t.lang_ukrainian} — ${t.lang_ukrainian_level}`,
            ];

            const sectionHeading = (text) => new Paragraph({
                spacing: { before: 260, after: 140 },
                border: {
                    bottom: { color: "DBEAFE", space: 1, style: BorderStyle.SINGLE, size: 6 },
                },
                children: [
                    new TextRun({ text, bold: true, size: 24, color: sectionColor }),
                ],
            });

            const bodyParagraph = (text) => new Paragraph({
                spacing: { after: 130, line: 320 },
                alignment: AlignmentType.JUSTIFIED,
                children: [
                    new TextRun({ text, ...baseText }),
                ],
            });

            const bulletItem = (text) => new Paragraph({
                bullet: { level: 0 },
                spacing: { after: 90, line: 300 },
                indent: { left: 360, hanging: 180 },
                children: [
                    new TextRun({ text, ...baseText }),
                ],
            });

            const compactLine = (label, value) => new Paragraph({
                spacing: { after: 70 },
                children: [
                    new TextRun({ text: `${label}: `, bold: true, ...baseText }),
                    new TextRun({ text: value, ...mutedText }),
                ],
            });

            const doc = new Document({
                sections: [{
                    properties: {
                        page: {
                            margin: { top: 720, right: 720, bottom: 720, left: 720 },
                        },
                    },
                    children: [
                        new Paragraph({
                            spacing: { after: 100 },
                            children: [
                                new TextRun({ text: t.name, bold: true, size: 34, color: "0F172A" }),
                            ],
                        }),
                        new Paragraph({
                            spacing: { after: 220 },
                            children: [
                                new TextRun({ text: t.title, italics: true, size: 24, color: "2563EB" }),
                            ],
                        }),
                        compactLine(t.contact, `+7 (918) 555-70-45`),
                        compactLine("Email", "maxim@maxegorov.com"),
                        compactLine("Location", t.city_name),
                        sectionHeading(t.skills_tech),
                        bodyParagraph(skills.join(" • ")),

                        sectionHeading(t.block1_title),
                        bodyParagraph(t.block1_text),
                        sectionHeading(t.block2_title),
                        bodyParagraph(t.block2_text),
                        sectionHeading(t.about),
                        bodyParagraph(t.about_text),
                        sectionHeading(t.experience),
                        new Paragraph({
                            spacing: { before: 80, after: 80 },
                            children: [
                                new TextRun({ text: t.job1_title, bold: true, size: 24, color: "0F172A" }),
                                new TextRun({ text: `  |  ${t.job1_date}`, bold: true, size: 20, color: "64748B" }),
                            ],
                        }),
                        bulletItem(t.job1_task1),
                        bulletItem(t.job1_task2),
                        new Paragraph({
                            spacing: { before: 140, after: 80 },
                            children: [
                                new TextRun({ text: t.job2_title, bold: true, size: 24, color: "0F172A" }),
                                new TextRun({ text: `  |  ${t.job2_date}`, bold: true, size: 20, color: "64748B" }),
                            ],
                        }),
                        bulletItem(t.job2_task1),
                        sectionHeading(t.education),
                        bulletItem(`${t.edu1_title} — ${t.edu1_inst}`),
                        bulletItem(`${t.edu2_title} — ${t.edu2_inst}`),
                        sectionHeading(t.certifications),
                        bulletItem(t.cert1),
                        bulletItem(t.cert2),

                        sectionHeading(t.languages),
                        ...languages.map((item) => bulletItem(item)),
                    ],
                }],
            });

            Packer.toBlob(doc).then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Resume_${t.name}.docx`;
                a.click();
            });
        };

        updateUI();
    </script>
</body>
</html>
